spring.application.name=generate-document

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

# Server
server.port=8400
server.servlet.context-path=/enterprise/m2m-autogestion/v2
server.undertow.max-http-post-size=-1
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.datasource.hikari.dataSourceProperties.fastConnectionFailoverEnabled=true

# HikariCP settings
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000
# DEV
#spring.datasource.hikari.schema=VOUCHER_BL
# PROD
spring.datasource.hikari.schema=OPS$INVENTAR
spring.datasource.hikari.poolName=${spring.application.name}-pool

# SECRETS
#DEV
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
#spring.datasource.url=jdbc:oracle:thin:@//10.38.56.213:1521/PDBFINAN27.netdesabasesdat.vcndesabasesdat.oraclevcn.com
#spring.datasource.username=voucher
#PROD
spring.datasource.url=jdbc:oracle:thin:@//130.2.0.5:1521/GYE
spring.datasource.username=apportfinanc
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

#externalizacion de config log
logging.config=/config/log4j2.xml

#swagger
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER


#CONFIGURACION ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=always

